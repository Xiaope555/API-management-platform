<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AI API Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<meta name="format-detection" content="telephone=no" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

<!--
  一套结构跑两种形态：
    ≥900px  电脑端 —— 左侧固定导航 + 右侧宽内容区，表格形态
    <900px  手机端（APK / 手机浏览器）—— 顶部栏 + 抽屉菜单 + 底部 Tab，卡片形态
  形态切换全交给 CSS，JS 只负责把同样的内容渲染出来。
-->
<div id="shell">

  <aside id="sidebar">
    <div class="sb-top">
      <span class="sb-mark">A</span>
      <span class="sb-name">AI API Hub<em>多平台密钥与余额管理</em></span>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot" id="sb-foot"></div>
  </aside>

  <div id="stage">
    <header id="nav"></header>
    <main id="view"></main>
    <nav id="tabbar"></nav>
  </div>

  <div id="drawer-scrim"></div>
</div>

<div id="toast"></div>
<div id="sheet-root"></div>

<script src="js/core.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
