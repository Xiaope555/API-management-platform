<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AI API Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#F8F6F2" />
<meta name="format-detection" content="telephone=no" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

<div id="desktop-hint">
  <div class="dh-title">AI API Hub</div>
  <div class="dh-sub">右侧为 360px 移动端视图，与设计稿 1:1 对应。<br>手机浏览器直接打开即可全屏使用。</div>
</div>

<div id="phone">
  <div class="notchbar">
    <span id="clock">--:--</span>
    <span class="sysicons">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="10" width="2.4" height="5" rx="1" fill="#22201D"/><rect x="5.2" y="7.6" width="2.4" height="7.4" rx="1" fill="#22201D"/><rect x="9.4" y="4.8" width="2.4" height="10.2" rx="1" fill="#22201D"/><rect x="13.6" y="2" width="2.4" height="13" rx="1" fill="#22201D" opacity=".3"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.6 6.1a10 10 0 0 1 12.8 0" stroke="#22201D" stroke-width="1.5" stroke-linecap="round"/><path d="M4.4 8.9a6 6 0 0 1 7.2 0" stroke="#22201D" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="12.4" r="1.3" fill="#22201D"/></svg>
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x=".7" y=".7" width="18" height="10.6" rx="2.6" stroke="#22201D" stroke-opacity=".3" stroke-width="1.2"/><rect x="2.6" y="2.6" width="12.4" height="6.8" rx="1.4" fill="#22201D"/><rect x="20" y="4.4" width="1.6" height="3.2" rx=".8" fill="#22201D" opacity=".35"/></svg>
    </span>
  </div>

  <header id="nav"></header>
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>

<div id="toast"></div>
<div id="sheet-root"></div>

<script src="js/core.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
